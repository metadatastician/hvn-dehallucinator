\* SPDX-License-Identifier: MPL-2.0
\* Negative control: the engine before 2026-11-09, whose `update <dir>` measured
\* whatever directory the caller named. Every count is a real measurement and
\* Guarantee (COMPLETE only on a measured zero) still holds; what fails is that
\* the zero need not be the bound target's. TLC must report GuaranteeBound
\* violated (artefacts survive in the target, an empty directory is measured,
\* COMPLETE is written); scripts/check-tla.sh fails if not.
CONSTANTS
    MaxTotal = 3
    MaxRemaining = 4
    MinRemaining = 1
    Slack = 5
    Original = FALSE
    OtherTarget = TRUE
SPECIFICATION Spec
INVARIANTS Guarantee GuaranteeBound
