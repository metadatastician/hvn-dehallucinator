# SPDX-License-Identifier: MPL-2.0
# TLA+ Gate — thin caller of the estate's TLA+ gate in
# hyperpolymath/proven-cicd-and-workflows. Enforcing, at the declared bounds
# (a model check is tested, not proven): TLC from the pinned tla2tools.jar
# v1.7.4 on Java 21 must pass every must_pass config and refute every
# must_refute config by the invariant named for it. Planted controls prove
# the judge can say no before its green is credited.
#
# Require `tla / TLA+ verdict`.
#
# Full-SHA pin, DE-ONBOARDED from actions.lock, no `secrets:` — see
# rust-ci.yml in this directory for why. This gate calls no other reusable
# workflow, so `contents: read` is all it holds.
name: TLA+ Gate

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tla:
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/tla-gate.yml@50a443f01b1b85e4957b893a6f1a0ed2e8a52459 # cicd-suite main
    # Inputs (optional; the defaults are hvn-dehallucinator's layout):
    #   spec_dir: verification/proofs/tlaplus
    #   spec: Engine.tla
    #   must_pass: Engine.cfg                         # whitespace-separated
    #   must_refute: "Original.cfg:Guarantee OtherTarget.cfg:GuaranteeBound"
    #                                                 # <config>:<Invariant>, whitespace-separated
