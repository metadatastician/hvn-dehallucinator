#
# Proof Kernel. What stays local here:
#   * models-agree-with-engine (HD-F-E): tests/difftest.sh runs the real engine
#     and requires EngineCore.agda and Engine.tla to reproduce every trace;
#   * recheck-legs: the mechanical cross-check of the 546-row explorer table in
#     Agda, Rocq and Lean (tests/crosscheck/check.sh).
# What moved to the estate suite (hyperpolymath/proven-cicd-and-workflows, one
# full-SHA pin per caller): the Agda kernel gate (agda-gate.yml, which also
# carries the thin `agda-kernel` job the ruleset requires), the TLA+ model
# check (tla-gate.yml), and the Rocq and Lean axiom judgements (rocq-gate.yml,
# lean-axioms-gate.yml), which replace scripts/check-recheck-legs.sh's reading
# of printed text with out-of-process kernel checks. The scripts stay in the
# tree and run locally; CI no longer calls them.
# Agda comes from the Ubuntu 24.04 archive (agda-bin 2.6.3), the version the
# MANIFEST was ground-truthed with.

name: Proof Kernel
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  models-agree-with-engine:
    # HD-F-E: tests/difftest.sh runs the real engine over 3,183 command
    # sequences and requires EngineCore.agda (via the proof kernel) and
    # Engine.tla (via TLC trace replay) to reproduce every one, then requires
    # both to refuse a corrupted trace and three engine mutants.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      JAVA: /usr/lib/jvm/java-21-openjdk-amd64/bin/java
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      # PROOF-POLICY section 6 deviation, as in the jobs above.
      - name: Install GHC, Agda and Java 21 (Ubuntu 24.04 archive)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ghc agda-bin openjdk-21-jre-headless
      - name: Assert the pinned toolchain
        run: bash scripts/assert-toolchain.sh agda ghc java
      - name: Differential test (models against the engine)
        run: bash tests/difftest.sh
  recheck-legs:
    # PROOF-POLICY section 2: the Rocq and Lean recheck legs of the Haruspex
    # theory theorems (Haruspex.agda, HaruspexExplorer.agda), re-proved. That
    # each leg compiles with no axiom, and names every theorem the
    # correspondence record lists, is judged by the suite's rocq-gate.yml and
    # lean-axioms-gate.yml (own workflows), no longer by a step here. This job
    # keeps the cross-check of the explorer table in all three kernels, and the
    # negative controls of scripts/check-recheck-legs.sh, which stays in the
    # tree but is no longer run by CI. docs/status/RECHECK-CORRESPONDENCE.adoc
    # records the bridge.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEAN_ARCHIVE_SHA256: af71a2569a9f68337de2434829b3008cd8e32c436e9cb6bd8c84a2c2ba3585c9
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      # PROOF-POLICY section 6 deviation: Rocq from the Ubuntu 24.04 archive,
      # Lean from the upstream release archive at a pinned SHA-256; neither
      # from the Guix manifest. The assert step fails on any other version.
      - name: Install Rocq and Agda (Ubuntu 24.04 archive)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends coq agda-bin zstd
      - name: Install Lean 4.15.0 (release archive, SHA-256 pinned)
        run: |
          curl -fsSL -o lean.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.15.0/lean-4.15.0-linux.tar.zst
          echo "$LEAN_ARCHIVE_SHA256  lean.tar.zst" | sha256sum -c -
          sudo mkdir -p /opt/lean
          sudo tar --zstd -xf lean.tar.zst -C /opt/lean
          echo /opt/lean/lean-4.15.0-linux/bin >> "$GITHUB_PATH"
      - name: Assert the pinned toolchain
        run: bash scripts/assert-toolchain.sh coq lean agda
      - name: Gate refuses its negative controls
        run: bash tests/proofs/recheck_legs_test.sh
      # The mechanical bridge: Agda (residual-evidence-types' own checker),
      # Rocq and Lean each compute the 546-row explorer table and must equal
      # tests/crosscheck/explorer-table.txt; a changed table must be refused.
      - name: Cross-check the explorer table in all three kernels
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: bash tests/crosscheck/check.sh
